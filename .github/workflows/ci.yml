name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: |
          make build VERSION="${GITHUB_SHA}"
          test "$(./factoryd version)" = "${GITHUB_SHA}"

      - name: vet
        run: go vet ./...

      # -count=1 is not decoration. A shared build cache replays cached test
      # RESULTS, so a green here could mean "nothing ran".
      - name: test
        run: go test -race -count=1 ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
